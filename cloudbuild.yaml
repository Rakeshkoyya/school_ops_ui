steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - 'BACKEND_URL=${_BACKEND_URL}'
      - '--build-arg'
      - 'NEXT_PUBLIC_API_URL=${_NEXT_PUBLIC_API_URL}'
      - '--build-arg'
      - 'NEXT_PUBLIC_GOOGLE_CLIENT_ID=${_NEXT_PUBLIC_GOOGLE_CLIENT_ID}'
      - '-t'
      - '${_IMAGE_TAG}'
      - '.'  

images:
  - '${_IMAGE_TAG}'

substitutions:
  _BACKEND_URL: 'https://trackbit-backend-565788486495.asia-southeast1.run.app'
  _NEXT_PUBLIC_API_URL: '/api/v1'
  _NEXT_PUBLIC_GOOGLE_CLIENT_ID: '565788486495-1m2ea00obtu7a2n0k8pppqtud7bvtn3r.apps.googleusercontent.com'
  _IMAGE_TAG: 'asia-southeast1-docker.pkg.dev/project-185374dc-4a37-48d6-888/trackbit-docker-repo/frontend:latest'
